
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niyyah Studio - Clock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #191919;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

.clock {
    display: flex;
    gap: 12px;
}

.card {
    width: 264px;
    height: 393px;
    background: #FEDDEE;
    border-radius: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.number {
    font-size: 180px;
    font-weight: 600;
    color: #FD71B1;
    line-height: 1;
    letter-spacing: -8px;
}

.day {
    position: absolute;
    bottom: 20px;
    right: 22px;
    font-size: 22px;
    font-weight: 500;
    color: #FD71B1;
    letter-spacing: 1px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #FD71B1;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.brand::before,
.brand::after {
    content: "";
    width: 35px;
    height: 1px;
    background: #FD71B1;
}

/* Responsive */
@media (max-width: 600px) {
    .card {
        width: 43vw;
        height: 60vw;
        border-radius: 25px;
    }

    .number {
        font-size: 25vw;
    }

    .day {
        font-size: 5vw;
        bottom: 12px;
        right: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="clock">

        <div class="card">
            <span class="number" id="hours">00</span>
        </div>

        <div class="card">
            <span class="number" id="minutes">00</span>
            <span class="day" id="day">MONDAY</span>
        </div>

    </div>


</div>

<script>
function updateClock() {
    const now = new Date();

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');

    const days = [
        'SUNDAY',
        'MONDAY',
        'TUESDAY',
        'WEDNESDAY',
        'THURSDAY',
        'FRIDAY',
        'SATURDAY'
    ];

    document.getElementById('hours').textContent = hours;
    document.getElementById('minutes').textContent = minutes;
    document.getElementById('day').textContent = days[now.getDay()];
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
