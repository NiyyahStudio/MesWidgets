<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niyyah Studio - Clock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #191919;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.clock {
    display: flex;
    gap: 10px;
}

.card {
    width: 210px;
    height: 315px;
    background: #FEDDEE;
    border-radius: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.number {
    font-size: 150px;
    font-weight: 700;
    color: #B80C54;
    line-height: 1;
    letter-spacing: -8px;
}

.day {
    position: absolute;
    bottom: 16px;
    right: 18px;
    font-size: 17px;
    font-weight: 600;
    color: #B80C54;
    letter-spacing: 1px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #B80C54;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.brand::before,
.brand::after {
    content: "";
    width: 30px;
    height: 1px;
    background: #B80C54;
}

@media (max-width: 600px) {
    .clock {
        gap: 8px;
    }

    .card {
        width: 43vw;
        height: 60vw;
        border-radius: 24px;
    }

    .number {
        font-size: 25vw;
        letter-spacing: -1.2vw;
    }

    .day {
        font-size: 3vw;
        bottom: 12px;
        right: 12px;
    }
}
</style>
</head>

<body>
<div class="container">
    <div class="clock">
        <div class="card">
            <span class="number" id="hours">00</span>
        </div>

        <div class="card">
            <span class="number" id="minutes">00</span>
            <span class="day" id="day">LUNDI</span>
        </div>
    </div>

    <div class="brand">Niyyah Studio</div>
</div>

<script>
function updateClock() {
    const now = new Date();

    document.getElementById('hours').textContent =
        String(now.getHours()).padStart(2, '0');

    document.getElementById('minutes').textContent =
        String(now.getMinutes()).padStart(2, '0');

    document.getElementById('day').textContent =
        new Intl.DateTimeFormat('fr-FR', { weekday: 'long' })
            .format(now)
            .toUpperCase();
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
