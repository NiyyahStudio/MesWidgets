
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niyyah Studio | Prayer Times</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600;700&family=Lavishly+Yours&display=swap" rel="stylesheet">

<style>
:root {
    --wine: #B80C54;
    --pink: #FD71B1;
    --soft-pink: #FDA9D2;
    --cream: #FEDDEE;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
}

body {
    width: 100%;
    min-width: 0;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    color: var(--wine);
    padding: 0;
}

.widget {
    width: 100%;
    max-width: 460px;
    min-width: 0;
    margin: 0 auto;
    background: var(--cream);
    border-radius: 28px;
    padding: clamp(14px, 4vw, 24px);
    overflow: hidden;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 22px;
}

.brand {
    font-family: 'Chewy', cursive;
    font-size: clamp(26px, 7vw, 30px);
    color: var(--wine);
}

.subtitle {
    font-family: 'Lavishly Yours', cursive;
    font-size: clamp(26px, 7vw, 30px);
    color: var(--pink);
    margin-top: -5px;
}

.date {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin-top: 8px;
}

/* NEXT PRAYER */
.next-prayer {
    background: var(--wine);
    color: white;
    border-radius: 20px;
    padding: clamp(16px, 4vw, 20px);
    text-align: center;
    margin-bottom: 18px;
}

.next-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    opacity: .85;
}

.next-name {
    font-family: 'Chewy', cursive;
    font-size: clamp(28px, 8vw, 32px);
    margin: 8px 0;
}

.countdown {
    font-size: clamp(23px, 7vw, 28px);
    font-weight: 600;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
}

/* PRAYER TIMES */
.prayers {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    min-width: 0;
}

.prayer {
    min-width: 0;
    width: 100%;
    background: var(--soft-pink);
    border-radius: 16px;
    padding: 13px clamp(10px, 3vw, 15px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    transition: background .2s, color .2s;
}

.prayer:last-child {
    grid-column: 1 / -1;
}

.prayer.active {
    background: var(--wine);
    color: white;
}

.prayer-name {
    min-width: 0;
    font-size: clamp(10px, 3vw, 12px);
    font-weight: 600;
    letter-spacing: .3px;
}

.prayer-time {
    flex: 0 0 auto;
    font-size: clamp(14px, 4vw, 17px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

/* LOCATION — below the prayer schedule */
.location {
    margin-top: 18px;
    padding: 13px 10px;
    border: 1px solid var(--soft-pink);
    border-radius: 15px;
    background: transparent;
    text-align: center;
    font-size: 11px;
}

.location button {
    max-width: 100%;
    background: var(--wine);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    margin-top: 9px;
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    cursor: pointer;
}

.location button:hover,
.refresh:hover {
    opacity: .85;
}

.status {
    font-size: 10px;
    text-align: center;
    line-height: 1.5;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.refresh {
    display: block;
    max-width: 100%;
    margin: 12px auto 0;
    border: 1px solid var(--wine);
    background: transparent;
    color: var(--wine);
    padding: 9px 18px;
    border-radius: 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    cursor: pointer;
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 8px;
    letter-spacing: 1.4px;
    line-height: 1.6;
    opacity: .8;
}

/* Small screens: preserve equal inner spacing on both columns */
@media (max-width: 360px) {
    .widget {
        border-radius: 22px;
        padding: 13px;
    }

    .prayers {
        gap: 8px;
    }

    .prayer {
        padding: 12px 10px;
        border-radius: 13px;
    }

    .prayer-name {
        font-size: 10px;
    }

    .prayer-time {
        font-size: 14px;
    }

    .date {
        font-size: 9px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>
<div class="widget">

    <header class="header">
        <div class="brand">Niyyah Studio</div>
        <div class="subtitle">A moment for your deen</div>
        <div class="date" id="date">LOADING...</div>
    </header>

    <section class="next-prayer">
        <div class="next-label">NEXT PRAYER</div>
        <div class="next-name" id="nextName">--</div>
        <div class="countdown" id="countdown">--:--:--</div>
        <div class="next-label" id="nextTime">Waiting for location</div>
    </section>

    <section class="prayers" id="prayers">
        <div class="prayer" data-name="Fajr">
            <span class="prayer-name">FAJR</span>
            <span class="prayer-time">--:--</span>
        </div>

        <div class="prayer" data-name="Dhuhr">
            <span class="prayer-name">DHUHR</span>
            <span class="prayer-time">--:--</span>
        </div>

        <div class="prayer" data-name="Asr">
            <span class="prayer-name">ASR</span>
            <span class="prayer-time">--:--</span>
        </div>

        <div class="prayer" data-name="Maghrib">
            <span class="prayer-name">MAGHRIB</span>
            <span class="prayer-time">--:--</span>
        </div>

        <div class="prayer" data-name="Isha">
            <span class="prayer-name">ISHA</span>
            <span class="prayer-time">--:--</span>
        </div>
    </section>

    <section class="location">
        <div id="locationText">Your location is not set</div>
        <button onclick="getLocation()">USE MY LOCATION</button>
    </section>

    <div class="status" id="status">
        Allow location access to load prayer times.
    </div>

    <button class="refresh" onclick="getLocation()">↻ Refresh</button>

    <footer class="footer">
        NIYYAH STUDIO · MAKE TIME FOR WHAT MATTERS
    </footer>

</div>

<script>
let coordinates = null;
let prayerData = null;
let tomorrowFajr = null;

const prayerNames = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];

function formatDate(date) {
    const d = String(date.getDate()).padStart(2, '0');
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const y = date.getFullYear();
    return `${d}-${m}-${y}`;
}

function updateDate() {
    document.getElementById('date').textContent =
        new Date().toLocaleDateString('en-GB', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        }).toUpperCase();
}

function getLocation() {
    const status = document.getElementById('status');

    if (!navigator.geolocation) {
        status.textContent = "Geolocation is not supported by this browser.";
        return;
    }

    status.textContent = "Finding your location...";

    navigator.geolocation.getCurrentPosition(
        async position => {
            coordinates = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
            };

            document.getElementById('locationText').textContent =
                "Prayer times for your current location";

            await loadPrayerTimes();
        },
        () => {
            status.textContent =
                "Location unavailable. Please allow location access.";
        },
        {
            enableHighAccuracy: true,
            timeout: 15000
        }
    );
}

async function fetchTimings(date) {
    const { latitude, longitude } = coordinates;

    const url =
        `https://api.aladhan.com/v1/timings/${formatDate(date)}` +
        `?latitude=${latitude}&longitude=${longitude}&method=12&school=0`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Unable to retrieve prayer times.");
    }

    const result = await response.json();

    if (result.code !== 200) {
        throw new Error("Prayer calculation failed.");
    }

    return result.data.timings;
}

function cleanTime(time) {
    const match = time.match(/\d{1,2}:\d{2}/);
    if (!match) throw new Error("Invalid prayer time received.");
    return match[0];
}

async function loadPrayerTimes() {
    const status = document.getElementById('status');

    try {
        status.textContent = "Calculating prayer times...";

        prayerData = await fetchTimings(new Date());

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);

        const tomorrowData = await fetchTimings(tomorrow);
        tomorrowFajr = tomorrowData.Fajr;

        prayerNames.forEach(name => {
            const card = document.querySelector(
                `.prayer[data-name="${name}"]`
            );

            card.querySelector('.prayer-time').textContent =
                cleanTime(prayerData[name]);

            card.classList.remove('active');
        });

        status.textContent = "Prayer times successfully updated ♡";
        updateClock();

    } catch (error) {
        status.textContent = "Unable to load prayer times. Please try again.";
        console.error(error);
    }
}

function updateClock() {
    if (!prayerData || !tomorrowFajr) return;

    const now = new Date();
    let next = null;
    let nextDate = new Date(now);

    for (const name of prayerNames) {
        const [hour, minute] = cleanTime(prayerData[name])
            .split(':').map(Number);

        const prayerDate = new Date(now);
        prayerDate.setHours(hour, minute, 0, 0);

        if (prayerDate > now) {
            next = name;
            nextDate = prayerDate;
            break;
        }
    }

    if (!next) {
        next = "Fajr";
        const [hour, minute] = cleanTime(tomorrowFajr)
            .split(':').map(Number);

        nextDate.setDate(nextDate.getDate() + 1);
        nextDate.setHours(hour, minute, 0, 0);
    }

    document.querySelectorAll('.prayer').forEach(card => {
        card.classList.toggle(
            'active',
            card.dataset.name === next &&
            nextDate.toDateString() === now.toDateString()
        );
    });

    document.getElementById('nextName').textContent = next;
    document.getElementById('nextTime').textContent =
        cleanTime(nextDate.toTimeString().slice(0, 5)) +
        (nextDate.toDateString() !== now.toDateString()
            ? " · TOMORROW" : "");

    const seconds = Math.max(0, Math.floor((nextDate - now) / 1000));

    const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');

    document.getElementById('countdown').textContent = `${h}:${m}:${s}`;
}

updateDate();
setInterval(updateClock, 1000);
setInterval(updateDate, 60000);

// Reuse location permission automatically when it was already granted.
if (navigator.permissions) {
    navigator.permissions.query({ name: 'geolocation' })
        .then(permission => {
            if (permission.state === 'granted') getLocation();
        })
        .catch(() => {});
}
</script>
</body>
</html>
